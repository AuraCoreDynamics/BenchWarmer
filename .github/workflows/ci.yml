name: BenchWarmer CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-zero-dependency:
    name: Zero-Dependency Verification (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run BLACK Pre-Flight Audit
        run: python scripts/black_preflight_audit.py

      - name: Execute Full Test Suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run BLACK Red-Team Harness
        run: python scripts/black_redteam_harness.py scoring.json

      - name: Compile and Smoke-Test Standalone .pyz Zipapp
        run: |
          python scripts/make_zipapp.py
          python dist/benchwarmer.pyz search llama --limit 1 --format json
          python dist/benchwarmer.pyz rank --limit 2 --format table
