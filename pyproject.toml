[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "benchwarmer"
version = "0.1.0"
description = "Offline Zero-Dependency LLM Benchmark Oracle"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
benchwarmer = "benchwarmer.cli:main"

[project.optional-dependencies]
build = [
    "huggingface_hub>=0.24.0",
    "pyarrow>=15.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchwarmer = [
    "data/benchmarks.db",
    "data/checksum.sha256",
    "db/schema.sql",
    "mcp_schema.json",
    "web/static/*",
]
